[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sec-scanner"
version = "0.1.0"
description = "Offline, read-only security linter for AI agent & MCP configurations (tool poisoning, secrets, auto-approve, unsafe launch commands)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["mcp", "model-context-protocol", "ai-agent", "security", "prompt-injection", "tool-poisoning", "sarif"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
agent-sec-scan = "agent_sec_scanner.cli:main"

[tool.setuptools]
packages = ["agent_sec_scanner"]
