# Example workflow: scan MCP / agent configs in this repo and upload SARIF to GitHub code scanning.
name: agent-sec-scan
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install agent-sec-scanner   # until published: pip install git+https://github.com/<org>/agent-sec-scanner@<tag>
      - name: Scan (fails on high+)
        run: agent-sec-scan . --format sarif --output agent-sec.sarif --fail-on high
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: agent-sec.sarif, category: agent-sec-scanner }
